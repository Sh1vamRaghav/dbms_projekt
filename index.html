<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timely</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Timely</h1>
        <nav>
            <button class="nav-btn active" data-section="students">Students</button>
            <button class="nav-btn" data-section="faculty">Faculty</button>
            <button class="nav-btn" data-section="admin">Admin</button>
        </nav>
    </header>

    <main id="content">
        <!-- Students Section -->
        <section id="students" class="section visible">
            <h2>Students</h2>

            <!-- Step 1: Main menu -->
            <div id="students-menu" class="menu visible">
                <button id="open-timetable" class="menu-item">📅 View Timetable</button>
                <button class="menu-item">🏫 Find Vacant Room</button>
            </div>

            <!-- Step 2: Timetable selection screen -->
            <div id="timetable-form" class="hidden">
                <h3>Select Batch and Year</h3>
                <div class="inputs">
                    <select id="batch-select">
                        <option value="">Select Batch</option>
                        <option value="CSE-A">CSE-A</option>
                        <option value="CSE-A">CSE-B</option>
                        <option value="ECE-A">ECE-A</option>
                        <option value="ECE-B">ECE-B</option>
                        <option value="EE-A">EE-A</option>
                        <option value="EE-B">EE-B</option>
                    </select>

                    <select id="year-select">
                        <option value="">Select Year</option>
                        <option value="2023">1<sup>st</sup></option>
                        <option value="2024">2<sup>nd</sup></option>
                        <option value="2025">3<sup>rd</sup></option>
                    </select>
                    <select id="day-select">
                        <option value="0">Select Day</option>
                        <option value="0">All</option>
                        <option value="1">Monday</option>
                        <option value="2">Tuesday</option>
                        <option value="3">Wednesday</option>
                        <option value="4">Thursday</option>
                        <option value="5">Friday</option>
                        <option value="6">Saturday</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button id="submit-timetable" class="menu-item">Submit</button>
                    <button id="back-to-menu" class="menu-item secondary">⬅ Back</button>
                </div>
            </div>

            <!-- Step 3: Timetable view -->
            <div id="timetable-container" class="hidden">
                <h3>Your Timetable</h3>
                <table id="timetable-table">
                    <thead>
                        <tr>
                            <th>Course ID</th>
                            <th>Division</th>
                            <th>Day</th>
                            <th>Room</th>
                            <th>Start</th>
                            <th>End</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button id="back-to-form" class="menu-item secondary">⬅ Back</button>
            </div>
        </section>


        <!-- Faculty Section -->
        <section id="faculty" class="section">
            <h2>Faculty</h2>
            <div class="menu">
                <button class="menu-item">📅 View Timetable</button>
                <button class="menu-item">👨‍🏫 View Faculty Timetable</button>
                <button class="menu-item">➕ Schedule Extra Class</button>
                <button class="menu-item">❌ Delete Extra Class</button>
                <button class="menu-item">🧑‍🎓 View Students List</button>
                <button class="menu-item">🏫 Find Vacant Room</button>
            </div>
        </section>

        <!-- Admin Section -->
        <section id="admin" class="section">
            <h2>Admin</h2>
            <div class="menu">
                <button class="menu-item">📘 Manage Academic Terms</button>
                <button class="menu-item">👩‍🏫 Manage Courses & Faculty</button>
                <button class="menu-item">📊 View All Timetables</button>
                <button class="menu-item">⏱ Manage Time Slots</button>
                <button class="menu-item">🏢 Manage Rooms</button>
                <button class="menu-item">🗓 Monitor Extra Classes</button>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Timely — Campus Scheduling Simplified</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
