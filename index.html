<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timely</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Timely</h1>
    <nav>
      <button class="nav-btn active" data-section="students">Students</button>
      <button class="nav-btn" data-section="faculty">Faculty</button>
      <button class="nav-btn" data-section="admin">Admin</button>
    </nav>
  </header>

  <main id="content">
    <!-- STUDENT SECTION -->
    <section id="students" class="section visible">
      <h2>Students</h2>
      <div id="students-menu" class="menu visible">
        <button id="open-student-timetable" class="menu-item">📅 View Timetable</button>
        <button class="menu-item">🏫 Find Vacant Room</button>
      </div>

      <div id="student-timetable-form" class="hidden">
        <h3>Select Batch, Year, and Day</h3>
        <select id="student-batch" required>
          <option value="">Select Batch</option>
          <option value="CSE-A">CSE-A</option>
          <option value="CSE-B">CSE-B</option>
          <option value="ECE-A">ECE-A</option>
          <option value="ECE-B">ECE-B</option>
          <option value="EE-A">EE-A</option>
          <option value="EE-B">EE-B</option>
        </select>

        <select id="student-year" required>
          <option value="">Select Year</option>
          <option value="2023">1st Year</option>
          <option value="2024">2nd Year</option>
          <option value="2025">3rd Year</option>
        </select>

        <select id="student-day" required>
          <option value="0">All Days</option>
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
        </select>

        <div class="form-actions">
          <button id="submit-student-timetable" class="menu-item">View</button>
          <button id="back-student-menu" class="menu-item secondary">⬅ Back</button>
        </div>
      </div>

      <div id="student-timetable-container" class="hidden">
        <h3>Your Timetable</h3>
        <table id="student-timetable-table">
          <thead>
            <tr>
              <th>Course ID</th>
              <th>Division</th>
              <th>Day</th>
              <th>Room</th>
              <th>Start</th>
              <th>End</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button id="back-student-form" class="menu-item secondary">⬅ Back</button>
      </div>
    </section>

    <!-- FACULTY SECTION -->
    <section id="faculty" class="section">
      <h2>Faculty</h2>
      <div id="faculty-menu" class="menu visible">
        <button id="open-faculty-timetable" class="menu-item">📅 View Faculty Timetable</button>
        <button id="open-extra-class" class="menu-item">➕ Schedule Extra Class</button>
      </div>

      <!-- Faculty Timetable -->
      <div id="faculty-timetable-form-container" class="hidden">
        <h3>View Faculty Timetable</h3>
        <form id="faculty-timetable-form">
          <label>Faculty:</label>
          <select id="faculty-select" required></select>

          <label>Batch:</label>
          <select id="faculty-batch">
            <option value="0">All Batches</option>
            <option value="CSE-A">CSE-A</option>
            <option value="CSE-B">CSE-B</option>
            <option value="ECE-A">ECE-A</option>
            <option value="ECE-B">ECE-B</option>
            <option value="EE-A">EE-A</option>
            <option value="EE-B">EE-B</option>
          </select>

          <label>Year:</label>
          <select id="faculty-year">
            <option value="0">All Years</option>
            <option value="2025">1st</option>
            <option value="2024">2nd</option>
            <option value="2023">3rd</option>
          </select>

          <label>Day:</label>
          <select id="faculty-day">
            <option value="0">Weekly</option>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
          </select>

          <div class="form-actions">
            <button type="submit" class="menu-item">View</button>
            <button type="button" id="back-faculty-menu" class="menu-item secondary">⬅ Back</button>
          </div>
        </form>
      </div>

      <div id="faculty-timetable-container" class="hidden">
        <h3>Faculty Timetable</h3>
        <table id="faculty-timetable-table">
          <thead>
            <tr>
              <th>Course</th>
              <th>Division</th>
              <th>Day</th>
              <th>Batch</th>
              <th>Start</th>
              <th>End</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button id="back-faculty-form" class="menu-item secondary">⬅ Back</button>
      </div>

      <!-- EXTRA CLASS FORM --> 
      <div id="extra-class-form" class="hidden">
        <h3>Schedule Extra Class</h3>
        <form id="extra-class">
          <label>Faculty:</label>
          <select id="fid" name="fid" required></select>

          <label>Course:</label>
          <select id="cid" name="cid" required></select>

          <label>Batch:</label>
          <select id="bid" name="bid" required>
            <option value="CSE-A">CSE-A</option>
            <option value="CSE-B">CSE-B</option>
            <option value="ECE-A">ECE-A</option>
            <option value="ECE-B">ECE-B</option>
            <option value="EE-A">EE-A</option>
            <option value="EE-B">EE-B</option>
          </select>

          <label>Division:</label>
          <select id="did" name="did">
            <option value="">Combined</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
          </select>

          <label>Year:</label>
          <select id="extraYear" name="year" required>
            <option value="2025" selected>1st</option>
            <option value="2024">2nd</option>
            <option value="2023">3rd</option>
          </select>

          <label>Room ID:</label>
          <select id="rid" name="rid" required></select>

          <label>Day:</label>
          <select id="day" name="day" required>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
          </select>

          <label>Time Slot:</label>
          <select id="tid" name="tid" required></select>

          <label>Date:</label>
          <input type="date" id="date" name="date" required />

          <div class="form-actions">
            <button type="submit" class="menu-item">Schedule</button>
            <button type="button" id="back-extra" class="menu-item secondary">⬅ Back</button>
          </div>
        </form>
      </div>

    </section>

    <!-- ADMIN -->
    <section id="admin" class="section">
      <h2>Admin</h2>
      <p>Coming soon...</p>
    </section>
  </main>

  <footer><p>© 2025 Timely</p></footer>

  <script src="script.js"></script>
</body>
</html>
